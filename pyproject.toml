[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-toolkit"
version = "1.3.3-dev"
description = "Multi Platform Sticker Toolkit for LINE and WeChat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
build = ["pyinstaller>=6,<7"]
dev = ["mypy>=1.11,<2", "ruff>=0.9,<1"]

[project.scripts]
sticker-toolkit = "sticker_toolkit.ui.cli.main:main"
sticker-toolkit-desktop = "sticker_toolkit.ui.desktop.app:main"

[tool.setuptools]
packages = [
  "core",
  "exporters",
  "sticker_toolkit",
  "sticker_toolkit.core",
  "sticker_toolkit.presets",
  "sticker_toolkit.services",
  "sticker_toolkit.ui",
  "sticker_toolkit.ui.cli",
  "sticker_toolkit.ui.desktop",
]
package-dir = {sticker_toolkit = "src/sticker_toolkit"}
py-modules = ["preview", "cover", "exporter"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["^tests/"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true
